<script language="javascript">
    if (document.getElementById("randnumber1").className == "tx3 txDisable") {
        document.getElementById("randnumber1").disabled = true;
        document.getElementById("hid_flag").value = "1";
        document.getElementById("sp_random").style.display = "";
        document.getElementById("randpic").style.display = "none";
    }
    document.getElementById("login").style.backgroundImage = "url(" + _webRootPath + "frame/themes/kingo/images/login.png)";

    var eye = document.getElementById("eye");
    var psd = document.getElementById("password");
    var flag = 0;
    eye.onclick = function chkeye() {
        if (flag == 0) {
            psd.type = "text";
            eye.src = "/frame/images/open.png";
            flag = 1;
        }
        else {
            psd.type = "password";
            eye.src = "/frame/images/close.png";
            flag = 0;
        }
    }

    //获取节点
    var box = document.getElementsByClassName("box")[0]
    var ul_li = document.querySelectorAll("ul li")
    var ol_li = document.querySelectorAll("ol li")
    var left = document.getElementById("left")
    var right = document.getElementById("right")

    var timer = null,
        index = 0;

    //封装
    function xuan() {
        index++//下标
        if (index >= ul_li.length) {
            index = 0//下标从0开始
        }
        content(index)
    }

    //封装函数
    function content(index) {
        for (var i = 0; i < ul_li.length; i++) {//排他
            ul_li[i].classList.remove("active")
            ol_li[i].classList.remove("active")
        }
        ul_li[index].classList.add("active")
        ol_li[index].classList.add("active")
    }

    //右边点击
    right.onclick = xuan
    //左边点击
    left.onclick = function () {
        index--
        if (index < 0) {//下标<0,下标=ul li的长度-1
            index = ul_li.length - 1
        }
    }
    //调用上面的函数
    timer = setInterval(xuan, 3000)//定时器
    //鼠标移入box，不冒泡
    box.onmouseenter = function () {
        //清除定时器
        clearInterval(timer)
        timer = null
    }
    ////鼠标移出box，不冒泡
    box.onmouseleave = function () {
        timer = setInterval(xuan, 3000)
    }
    for (var q = 0; q < ol_li.length; q++) {
        ol_li[q].ind = q;
        ol_li[q].onclick = function () {//排他
            index = this.ind
            content(this.ind)
        }
    }

</script>
